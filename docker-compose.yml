# BSM 461 Dönem Projesi — Başlangıç Kiti
#
#   docker compose up -d                          # çekirdek: Kafka + S3 + Spark + araçlar
#   docker compose --profile arama up -d          # + Elasticsearch   (şablon 1 ve 4)
#   docker compose --profile arama --profile pano up -d   # + Kibana  (şablon 1)
#   docker compose --profile servis up -d         # + MongoDB         (servis deposu örneği, H8)
#   ./dogrula.sh                                  # her şey ayakta mı?
#   docker compose down                           # durdur (veri durur)
#   docker compose down -v                        # durdur ve BÜTÜN veriyi sil
#
# Ayrıntı: README.md

name: bsm461

services:

  # ── Olay günlüğü: Kafka 4.0, ZooKeeper'sız (KRaft) — H10 ──────────────────
  kafka:
    image: apache/kafka:4.0.0
    container_name: bsm461-kafka
    ports:
      - "9092:9092"          # bilgisayarınızdan: localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: ICERI://:29092,DISARI://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: ICERI://kafka:29092,DISARI://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ICERI:PLAINTEXT,DISARI:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: ICERI
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_NUM_PARTITIONS: 3                       # yeni konular varsayılan 3 bölümlü
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1     # tek düğüm → tek kopya (raporda tartışın!)
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      JAVA_TOOL_OPTIONS: "-XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0"   # Apple M4 Mac çökmesine karşı (README)
    volumes:
      - kafka-veri:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # ── Nesne deposu: SeaweedFS, S3 uyumlu — H4 ───────────────────────────────
  # (MinIO'nun hazır imajları 2025'ten beri açık erişimde değil; S3 API'si aynı.)
  s3:
    image: chrislusf/seaweedfs:4.48
    container_name: bsm461-s3
    command: >
      server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=1024 -volume.max=0
    ports:
      - "8333:8333"          # S3 adresi: http://localhost:8333
    volumes:
      - s3-veri:/data
      - ./araclar/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Kovaları bir kez oluşturur ve çıkar: ham · islenmis · tablolar
  s3-kur:
    build: ./araclar
    image: bsm461-araclar:1
    container_name: bsm461-s3-kur
    command: ["python", "/kit/araclar/kova_kur.py"]
    volumes:
      - .:/kit
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"

  # ── Toplu ve akış işleme: Spark 3.5 — H6, H7, H9, H11 ─────────────────────
  # Kalıcı bir "tezgâh": işleri içinden spark-submit ile çalıştırırsınız.
  spark:
    image: apache/spark:3.5.3-scala2.12-java17-python3-ubuntu
    container_name: bsm461-spark
    user: root
    command: ["sleep", "infinity"]
    working_dir: /kit
    ports:
      - "4040:4040"          # Spark UI (bir iş çalışırken): http://localhost:4040
    environment:
      PATH: "/kit/bin:/opt/spark/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"   # /kit/bin: sessiz spark-submit
      JAVA_TOOL_OPTIONS: "-XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0"   # Apple M4 Mac çökmesine karşı (README)
    volumes:
      - .:/kit
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./log4j2.properties:/opt/spark/conf/log4j2.properties:ro
      - spark-ivy:/opt/ivy          # indirilen kütüphaneler (ilk çalıştırmada bir kez)
    depends_on:
      kafka:
        condition: service_healthy
      s3:
        condition: service_healthy

  # ── Python araçları: üretici, doğrulama, arama örneği ─────────────────────
  araclar:
    build: ./araclar
    image: bsm461-araclar:1
    container_name: bsm461-araclar
    command: ["sleep", "infinity"]
    working_dir: /kit
    volumes:
      - .:/kit
    depends_on:
      kafka:
        condition: service_healthy
      s3:
        condition: service_healthy

  # ── Arama: Elasticsearch — H8 (şablon 1 ve 4) ─────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: bsm461-es
    profiles: ["arama", "pano"]        # Kibana (pano) Elasticsearch olmadan çalışmaz
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"       # yalnızca yerel geliştirme için!
      # Apple M4 Mac çökmesine karşı (README) — ES, JAVA_TOOL_OPTIONS'ı yok sayar; iki ayrı değişken gerekir
      ES_JAVA_OPTS: "-Xms768m -Xmx768m -XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0"
      CLI_JAVA_OPTS: "-XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0"
    ports:
      - "9200:9200"          # http://localhost:9200
    volumes:
      - es-veri:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q -E '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ── Pano: Kibana (isteğe bağlı, şablon 1) ─────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: bsm461-kibana
    profiles: ["pano"]
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
    ports:
      - "5601:5601"          # http://localhost:5601
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ── Servis deposu örneği: MongoDB — H8 (isteğe bağlı) ─────────────────────
  # Başka bir servis deposu seçerseniz (Cassandra, Redis, PostgreSQL…) buraya kendiniz ekleyin.
  mongo:
    image: mongo:7.0
    container_name: bsm461-mongo
    profiles: ["servis"]
    ports:
      - "27017:27017"        # mongodb://localhost:27017
    volumes:
      - mongo-veri:/data/db

volumes:
  mongo-veri:
  kafka-veri:
  s3-veri:
  spark-ivy:
  es-veri:
