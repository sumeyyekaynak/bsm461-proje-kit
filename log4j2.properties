# Spark'ın ekrana yazdığı ayrıntılı günlükleri kısar: yalnızca uyarı ve hatalar görünür.
# Daha fazla ayrıntı isterseniz "warn" yerine "info" yazın.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = konsol
appender.console.type = Console
appender.console.name = konsol
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = error
logger.kafka.name = org.apache.kafka
logger.kafka.level = error
logger.delta.name = org.apache.spark.sql.delta
logger.delta.level = error
