# Spark'ın her işte kullandığı ayarlar. spark-submit bu dosyayı kendiliğinden okur.

# İlk çalıştırmada Maven Central'dan indirilir (birkaç dakika, ~300 MB), sonra önbellekten gelir.
#   Kafka bağlayıcısı · S3 (s3a) erişimi · Delta Lake tablo biçimi
spark.jars.packages     org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.apache.hadoop:hadoop-aws:3.3.4,io.delta:delta-spark_2.12:3.2.1
spark.jars.ivy          /opt/ivy

# S3 = SeaweedFS (kit içindeki "s3" servisi)
spark.hadoop.fs.s3a.endpoint                 http://s3:8333
spark.hadoop.fs.s3a.access.key               bsm461
spark.hadoop.fs.s3a.secret.key               bsm461-gizli
spark.hadoop.fs.s3a.path.style.access        true
spark.hadoop.fs.s3a.connection.ssl.enabled   false
spark.hadoop.fs.s3a.impl                     org.apache.hadoop.fs.s3a.S3AFileSystem

# Delta Lake
spark.sql.extensions              io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog   org.apache.spark.sql.delta.catalog.DeltaCatalog

# Tek makinede küçük veri: varsayılan 200 shuffle bölümü fazla (H7)
spark.sql.shuffle.partitions      8
spark.driver.memory               1g
spark.ui.showConsoleProgress      false

# explain() çıktısı büyük planlarda kısaltılmasın (Adım 8)
spark.sql.debug.maxToStringFields  200
